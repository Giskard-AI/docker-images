name: Update python dockerfile

on:
    schedule:
    # Monday 04:00 UTC: inside the shared Renovate window (Monday 00:00-06:59 Europe/Paris) all year.
    - cron: '0 4 * * 1'
    workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    name: Generate Dockerfiles
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # clone repo
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      python_versions: ${{ steps.changes.outputs.python_versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Try to update dockerfile
        working-directory: python
        run: |
          bash generate_dockerfile.sh

      - name: Verify Ubuntu digest is pinned in Dockerfiles
        run: |
          set -euo pipefail
          jq -e '.default == "24.04"' python/base-images.json
          jq -e '.images["24.04"].image | test("^ubuntu:24\\.04@sha256:[0-9a-f]{64}$")' python/base-images.json
          jq -e '.images["26.04"].image | test("^ubuntu:26\\.04@sha256:[0-9a-f]{64}$")' python/base-images.json
          jq -e '.images["24.04"].debian_version == "bookworm"' python/base-images.json
          jq -e '.images["26.04"].debian_version == "trixie"' python/base-images.json

          for version in 24.04 26.04; do
            image="$(jq -r --arg version "${version}" '.images[$version].image' python/base-images.json)"
            debian_variant="$(jq -r --arg version "${version}" '.images[$version].debian_variant' python/base-images.json)"
            debian_version="$(jq -r --arg version "${version}" '.images[$version].debian_version' python/base-images.json)"
            for f in "python/ubuntu${version}"/Dockerfile_*; do
              echo "Checking $f"
              grep -Fq "ARG UBUNTU_BASE_IMAGE=${image}" "$f"
              grep -Fq "/${debian_variant}-${debian_version}/Dockerfile" "$f"
              grep -q '^FROM ${UBUNTU_BASE_IMAGE} AS dev$' "$f"
            done
          done

      - name: Detect changes
        id: changes
        run: |
          set -euo pipefail
          # One <ubuntu>:<python line>:<old>:<new> entry per changed Dockerfile.
          entries=()
          while read -r f; do
            ubuntu="${f#python/ubuntu}"
            ubuntu="${ubuntu%%/*}"
            old="$(git show "HEAD:${f}" | sed -nE 's/^ENV PYTHON_VERSION[ =]//p')"
            new="$(sed -nE 's/^ENV PYTHON_VERSION[ =]//p' "${f}")"
            entries+=("${ubuntu}:${f##*/Dockerfile_}:${old}:${new}")
          done < <(git diff --name-only -- 'python/ubuntu*/Dockerfile_*')

          if [ "${#entries[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "${entries[@]}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "python_versions=${entries[*]}" >> "$GITHUB_OUTPUT"

      - name: Upload generated Dockerfiles
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockerfiles
          path: python/ubuntu*/Dockerfile_*
          if-no-files-found: error
          retention-days: 1

  create-pr:
    name: Open the update PR
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read # clone repo (app token handles write operations)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download generated Dockerfiles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dockerfiles
          path: python

      - name: Build commit message and PR title
        id: message
        env:
          PYTHON_VERSIONS: ${{ needs.generate.outputs.python_versions }}
        run: |
          set -euo pipefail
          # The versions come from the job that ran repository code: accept strict version strings only.
          read -ra entries <<< "${PYTHON_VERSIONS}"
          if [ "${#entries[@]}" -eq 0 ] || [[ "${PYTHON_VERSIONS}" == *$'\n'* ]]; then
            echo "Missing or multi-line Python version entries" >&2
            exit 1
          fi
          mapfile -t entries < <(printf '%s\n' "${entries[@]}" | sort -t: -k2,2V -k1,1V)

          declare -A pairs=()
          minors=()
          body=""
          for i in "${!entries[@]}"; do
            IFS=: read -r ubuntu minor old new extra <<< "${entries[$i]}"
            if ! [[ "${ubuntu}" =~ ^[0-9]+\.[0-9]+$ && "${minor}" =~ ^3\.[0-9]+$ \
              && "${old}" =~ ^3\.[0-9]+\.[0-9]+$ && "${new}" =~ ^3\.[0-9]+\.[0-9]+$ \
              && "${old}" == "${minor}".* && "${new}" == "${minor}".* && -z "${extra}" ]]; then
              echo "Invalid Python version entry #${i}" >&2
              exit 1
            fi
            body+="- Ubuntu ${ubuntu}, Python ${minor}: ${old} → ${new}"$'\n'
            if [ "${old}" != "${new}" ]; then
              [[ -v "pairs[${minor}]" ]] || minors+=("${minor}")
              pairs[${minor}]+="${old} → ${new} (Ubuntu ${ubuntu})"$'\n'
            fi
          done

          # One entry per Python line, split per Ubuntu version only when they differ.
          items=()
          for minor in "${minors[@]}"; do
            mapfile -t changes < <(printf '%s' "${pairs[${minor}]}")
            mapfile -t distinct < <(printf '%s\n' "${changes[@]}" | sed 's/ (Ubuntu .*)$//' | sort -u)
            if [ "${#distinct[@]}" -eq 1 ]; then
              items+=("${distinct[0]}")
            else
              items+=("${changes[@]}")
            fi
          done

          if [ "${#items[@]}" -eq 0 ]; then
            title="chore(deps): regenerate Python Dockerfiles"
          else
            printf -v joined '%s, ' "${items[@]}"
            title="chore(deps): update Python ${joined%, }"
          fi

          {
            echo "title=${title}"
            echo "body<<EOF"
            printf '%s' "${body}"
            echo "EOF"
            echo "commit-message<<EOF"
            printf '%s\n\n%s' "${title}" "${body}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate automation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request # zizmor: ignore[superfluous-actions]
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: ${{ steps.message.outputs.commit-message }}
          add-paths: |
            python/ubuntu*/Dockerfile_*
          base: main
          branch: cron-python-update
          title: ${{ steps.message.outputs.title }}
          body: ${{ steps.message.outputs.body }}
          assignees: Hartorn
          token: ${{ steps.app-token.outputs.token }}
